[project]
name = "vvn"
dynamic = ["version"]
description = "Add your description here"
readme = "README.md"
authors = [{ name = "René de Hesselle", email = "dehesselle@web.de" }]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "fsspec>=2025.12.0",
    "lxml[html-clean]>=6.0.2",
    "requests>=2.32.5",
    "semver>=3.0.4",
    "urlpath>=2.0.0",
]

[project.scripts]
vvn = "vvn:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/vvn/_version.py"
